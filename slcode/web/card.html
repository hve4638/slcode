<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slcode</title>
<style id="css"></style>
</head>
<body>
<div id="root"></div>
<script type="module">
// 옛 플러그인의 카드 모드 캐리어 (ticket slcode-card-svc-token-dead). 1단 카드(ticket slcode-card-iframe-flatten) 이전 플러그인이 이 파일을 serve 의 web.files 로 받아 주소 없는 sandbox
// iframe(srcdoc)에 넣는다. 준비되면 slcode.ready 를 알리고, 플러그인이 MessagePort 와 나머지 화면 파일(모듈·css)을 넘긴다.
// 모듈은 상대 경로 import 를 blob 주소로 바꿔 잇는다 — srcdoc 엔 상대 경로가 풀릴 주소가 없다.
addEventListener('message', async function boot(e) {
  if (e.source !== parent || e.data?.type !== 'slcode.port' || !e.ports[0]) return;
  removeEventListener('message', boot);
  const files = e.data.files;
  document.getElementById('css').textContent = files['style.css'] ?? '';
  const urls = {};
  const mod = (name) => (urls[name] ??= URL.createObjectURL(new Blob([files[name].replace(/from '\.\/([\w.-]+\.js)'/g, (_, d) => `from '${mod(d)}'`)], { type: 'text/javascript' })));
  const { mountCard } = await import(mod('card.js'));
  mountCard(document.getElementById('root'), e.ports[0], e.data.ui ?? {}, { reload: () => parent.postMessage({ type: 'slcode.reload' }, '*') }); // serve 가 바뀌었다 — 플러그인이 새 화면 파일로 다시 그린다
});
parent.postMessage({ type: 'slcode.ready' }, '*');
</script>
</body>
</html>
