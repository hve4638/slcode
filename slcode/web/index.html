<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slcode</title>
<script>
// 세션 주소 /s/<id> 아래에서도 자원·ws·file 의 상대 경로는 웹의 뿌리 기준이다 (ticket slcode-web-session-url). 접두사(/svc/<토큰>/)가 있어도 그대로 둔다
{ const b = document.createElement('base'); b.href = location.pathname.replace(/s\/[^/]*\/?$/, ''); document.head.append(b); }
</script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="root"></div>
<script type="module">
// 웹 모드 캐리어. 이 서버(slcode 명령 하나)는 메인 세션과 그 자손을 다룬다 — 주소 /s/<id> 가 세션을 고르고, `/` 는 메인 세션 주소로 옮긴다 (ticket slcode-web-session-url).
// ?token= 은 localStorage 로 옮기고 URL 에서 지운다 (루프백 밖으로 열었을 때만 붙는다).
import { WsTransport } from './rpc.js';
import { mountAgentFront } from './app.js';
import { setFileToken } from './markdown.js';

const q = new URLSearchParams(location.search);
// sandbox iframe(superlite 새 방식 카드 안의 /svc 화면)은 출처가 없어 localStorage 가 SecurityError — 그때는 URL 의 토큰만 쓴다
let token = q.get('token') ?? '';
try {
  if (token) localStorage.setItem(`slcode.token.${location.host}`, token);
  else token = localStorage.getItem(`slcode.token.${location.host}`) ?? '';
} catch {}
if (q.get('token')) history.replaceState(null, '', location.pathname);
// 상대 경로 — superlite /svc/<토큰>/ 아래에서도 이 페이지 옆의 ws 로 (ticket plugin-service-web)
const wsFor = (id) => { const u = new URL('ws', document.baseURI); u.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'; u.search = id ? `?id=${encodeURIComponent(id)}` : ''; return u.href; };
const urlOf = (id) => new URL(`s/${encodeURIComponent(id)}`, document.baseURI).href;
const idInPath = () => { const m = /\/s\/([^/]+)\/?$/.exec(location.pathname); return m ? decodeURIComponent(m[1]) : null; };
setFileToken(token); // 답변 속 로컬 파일(file?path=)도 같은 토큰으로

// 세션 화면은 처음 볼 때(또는 미리 불러올 때) 만들고 지우지 않는다. 옮길 때는 보이는 화면만 바꾼다 — 페이지를 새로 읽지 않아 바로 바뀌고 스크롤·입력이 남는다.
// iframe 을 쓰지 않는다: 포커스가 문서 경계를 넘지 않게 (사용자 2026-11-06). 숨은 화면은 inert 라 포커스를 받지 않고, document 에 건 처리도 스스로 넘긴다
const PRELOAD_MAX = 8; // 메뉴를 열 때 미리 만드는 화면 수 — 화면마다 연결과 기록을 받는다
const root = document.getElementById('root');
const slots = new Map(); // 세션 id → 화면
let visible = null;
function mount(id) {
  const el = document.createElement('div');
  el.className = 'session-slot'; el.inert = true;
  root.append(el);
  const transport = new WsTransport(wsFor(id), token);
  const slot = { el, title: null, front: null };
  if (id) slots.set(id, slot);
  slot.front = mountAgentFront(el, transport, {
    sessionId: id ?? undefined, navigate, preload,
    onAttach: (sid, info) => {
      slot.title = info.title || `slcode · ${sid}`;
      if (slot === visible) document.title = slot.title;
      if (id) return;
      // `/` 로 들어왔다 — 메인 세션 주소로. 다시 붙을 때도 이 세션을 찾아, 포트를 물려받은 다른 세션으로 말없이 바뀌지 않게 한다
      slots.set(sid, slot);
      try { history.replaceState(null, '', urlOf(sid)); } catch {}
      transport.url = wsFor(sid);
    },
  });
  return slot;
}
function reveal(slot) {
  if (visible) visible.el.inert = true;
  slot.el.inert = false;
  visible = slot;
  document.title = slot.title ?? 'slcode'; // 열 수 없는 세션은 attach 하지 않아 제목이 없다
}
function show(id) {
  const slot = slots.get(id) ?? mount(id);
  if (slot === visible) return;
  reveal(slot);
  slot.front.shown();
}
function navigate(id) {
  if (slots.get(id) === visible) return;
  history.pushState(null, '', urlOf(id));
  show(id);
}
function preload(ids) { for (const id of ids.filter((x) => !slots.has(x)).slice(0, PRELOAD_MAX)) mount(id); }
addEventListener('popstate', () => { const id = idInPath(); if (id) show(id); });
reveal(mount(idInPath()));
</script>
</body>
</html>
