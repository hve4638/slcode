# 태그 v<버전> 을 push 하면 slcode 바이너리 zip 을 만들어 GitHub release 로 공개한다 (slcode/README.md "바이너리 배포").
# 플러그인(main.js)은 release 태그 v<ver> 와 자산 slcode-<ver>-<platform>.zip 만 안다 — 바꾸면 그쪽도 바꾼다.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # install·테스트가 남의 코드를 돌리므로 토큰을 .git/config 에 남기지 않는다
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: 태그와 버전 대조
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import { satisfies } from './main.js';
          const tag = process.env.TAG, ver = tag.slice(1);
          const plugin = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('slcode/package.json', 'utf8'));
          const errs = [];
          if (plugin.version !== ver) errs.push(`plugin.json version ${plugin.version} 이 태그 ${tag} 와 다르다`);
          if (pkg.version !== ver) errs.push(`slcode/package.json version ${pkg.version} 이 태그 ${tag} 와 다르다`);
          if (!satisfies(ver, plugin.binary.version)) errs.push(`plugin.json binary.version ${plugin.binary.version} 이 ${ver} 를 만족하지 않는다`);
          for (const e of errs) console.error(`::error::${e}`);
          if (errs.length) process.exit(1);
          console.log(`버전 ${ver} 일치`);
          EOF

      - name: 빌드
        working-directory: slcode
        run: pnpm install --frozen-lockfile && pnpm build

      - name: slcode-plugin dist 대조
        # superlite-for-agents 가 커밋한 dist 를 넣어 간다 — 빌드가 바꾼 것이 있으면 커밋이 낡은 것이다
        run: |
          git status --porcelain -- slcode/slcode-plugin/dist | tee /tmp/dist.diff
          if [ -s /tmp/dist.diff ]; then echo "::error::slcode/slcode-plugin/dist 가 src 와 다르다 — pnpm build 뒤 커밋"; exit 1; fi

      - name: 테스트
        working-directory: slcode
        timeout-minutes: 10
        run: pnpm test

      - name: zip
        run: slcode/scripts/release.sh

      - name: 연기 검사 (linux-x64 zip)
        timeout-minutes: 5
        run: slcode/scripts/smoke.sh "slcode/release/slcode-${TAG#v}-linux-x64.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zips
          path: slcode/release/slcode-*.zip
          if-no-files-found: error
          compression-level: 0 # 이미 zip 이다
          retention-days: 3

  smoke-arm64:
    # zip 은 x64 러너에서 만들고, 실행 검사만 arm 러너에서 한다
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zips
          path: zips
      - name: 연기 검사 (linux-arm64 zip)
        timeout-minutes: 5
        run: slcode/scripts/smoke.sh "zips/slcode-${TAG#v}-linux-arm64.zip"

  publish:
    # 세 플랫폼 검사가 모두 통과해야 공개한다 (사용자 결정 2026-11-04). 실패하면 release 가 생기지 않는다
    needs: [build, smoke-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zips
          path: zips

      - name: SHA256SUMS.txt
        working-directory: zips
        run: sha256sum "slcode-${TAG#v}-linux-x64.zip" "slcode-${TAG#v}-linux-arm64.zip" "slcode-${TAG#v}-win-x64.zip" | tee SHA256SUMS.txt

      - name: release 공개
        working-directory: zips
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # 태그에 release 가 이미 있으면 자산만 덮어쓴다
        run: |
          files=("slcode-${TAG#v}-linux-x64.zip" "slcode-${TAG#v}-linux-arm64.zip" "slcode-${TAG#v}-win-x64.zip" SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "slcode $TAG" --notes "slcode $TAG 바이너리 (linux-x64, linux-arm64, win-x64)"
          fi
